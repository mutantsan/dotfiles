config_version = 14

[accessibility]
ui_scale = 1.1000000089406967

[bar.main]
capsule_padding = 5.0
capsule_radius = 0
end = [
    "tray",
    "wallpaper",
    "notifications",
    "volume",
    "brightness",
    "network",
    "control-center",
    "bluetooth",
    "theme_mode"
]
margin_ends = 0
padding = 20
radius = 0
scale = 1.350000012665987
start = [ "workspaces", "sysmon", "recorder" ]
widget_spacing = 13

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 970.0
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/screen_recorder"]
video_source = "region"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 0.0

    [shell.launcher]
    show_icons = false

[theme]
builtin = "Nord"
community_palette = "Nord Aurora"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/kiwi/Pictures/602575.png"

[wallpaper.last]
path = "/home/kiwi/Pictures/602575.png"

[wallpaper.monitors.DP-1]
path = "/home/kiwi/Pictures/602575.png"

[widget.control-center]
enabled = false

[widget.network]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"